<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Estoque — VBZ</title>
<style>
:root {
  --md-primary:#6750A4; --md-on-primary:#FFFFFF;
  --md-primary-container:#EADDFF; --md-on-primary-container:#21005D;
  --md-secondary-container:#E8DEF8; --md-on-secondary-container:#1D192B;
  --md-surface:#FEF7FF; --md-surface-container:#F3EDF7; --md-surface-container-high:#ECE6F0;
  --md-on-surface:#1D1B20; --md-on-surface-variant:#49454F;
  --md-outline:#79747E; --md-outline-variant:#CAC4D0;
  --md-warn-container:#FFEFC3; --md-on-warn-container:#5C4A00;
  --md-err:#B3261E; --md-err-container:#F9DEDC; --md-on-err-container:#410E0B;
  --md-ok:#1B6E3C;
  --md-elev-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --md-state-hover:rgba(103,80,164,.08);
}
@media (prefers-color-scheme: dark) { :root {
  --md-primary:#D0BCFF; --md-on-primary:#381E72;
  --md-primary-container:#4F378B; --md-on-primary-container:#EADDFF;
  --md-secondary-container:#4A4458; --md-on-secondary-container:#E8DEF8;
  --md-surface:#141218; --md-surface-container:#211F26; --md-surface-container-high:#2B2930;
  --md-on-surface:#E6E0E9; --md-on-surface-variant:#CAC4D0;
  --md-outline:#938F99; --md-outline-variant:#49454F;
  --md-warn-container:#453B00; --md-on-warn-container:#F1E48A;
  --md-err:#F2B8B5; --md-err-container:#8C1D18; --md-on-err-container:#F9DEDC;
  --md-ok:#7ADC9B;
  --md-state-hover:rgba(208,188,255,.08);
} }
* { box-sizing:border-box; }
html { color-scheme: light dark; }
body { margin:0; padding:0 0 32px; background:var(--md-surface); color:var(--md-on-surface); font:400 16px/1.5 Roboto,"Segoe UI",system-ui,sans-serif; }
.appbar { position:sticky; top:0; z-index:5; background:var(--md-surface); padding:20px 16px 12px; }
.appbar .in { max-width:840px; margin:0 auto; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.appbar h1 { margin:0; font-size:24px; font-weight:500; }
.appbar .sub { color:var(--md-on-surface-variant); font-size:14px; }
main { max-width:840px; margin:0 auto; padding:8px 16px; display:flex; flex-direction:column; gap:16px; }
.card { background:var(--md-surface-container); border-radius:16px; padding:20px; box-shadow:var(--md-elev-1); }
.card > h2 { margin:0 0 12px; font-size:16px; font-weight:500; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
table { width:100%; border-collapse:collapse; font-size:14.5px; }
th { text-align:left; font-size:12px; letter-spacing:.04em; color:var(--md-on-surface-variant); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--md-outline-variant); }
td { padding:9px 8px; border-bottom:1px solid var(--md-outline-variant); vertical-align:top; }
tr:last-child td { border-bottom:none; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.saldo-ok { color:var(--md-ok); font-weight:500; }
.saldo-baixo { color:var(--md-err); font-weight:700; }
.chip { display:inline-block; font-size:11.5px; padding:2px 10px; border-radius:999px; background:var(--md-secondary-container); color:var(--md-on-secondary-container); }
.chip.entrada { background:color-mix(in srgb, var(--md-ok) 18%, transparent); color:var(--md-ok); }
.chip.saida { background:var(--md-err-container); color:var(--md-on-err-container); }
.chip.baixo { background:var(--md-err-container); color:var(--md-on-err-container); font-weight:600; }
form.mov { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; align-items:end; }
form.mov .wide { grid-column:1/-1; }
label.fld { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--md-on-surface-variant); }
label.fld input, label.fld select {
  padding:10px 12px; font:inherit; font-size:15px; color:var(--md-on-surface);
  background:transparent; border:1px solid var(--md-outline); border-radius:8px; min-width:0;
}
label.fld input:focus, label.fld select:focus { outline:2px solid var(--md-primary); outline-offset:-1px; }
.seg { display:flex; border:1px solid var(--md-outline); border-radius:999px; overflow:hidden; }
.seg label { flex:1; display:flex; align-items:center; justify-content:center; min-height:42px; padding:4px 10px; cursor:pointer; font-size:13.5px; font-weight:500; transition:background .15s; }
.seg label:hover { background:var(--md-state-hover); }
.seg label + label { border-left:1px solid var(--md-outline); }
.seg input { position:absolute; opacity:0; pointer-events:none; }
.seg label.on { background:var(--md-secondary-container); color:var(--md-on-secondary-container); }
.btn { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 22px; background:var(--md-primary); color:var(--md-on-primary); font:500 14px/1 inherit; border:none; border-radius:999px; cursor:pointer; box-shadow:var(--md-elev-1); }
.btn.tonal { background:var(--md-secondary-container); color:var(--md-on-secondary-container); box-shadow:none; }
.btn.txt { background:none; color:var(--md-primary); box-shadow:none; padding:0 12px; min-height:32px; }
.del { background:none; border:none; cursor:pointer; color:var(--md-on-surface-variant); font-size:16px; padding:2px 6px; border-radius:8px; }
.del:hover { background:var(--md-state-hover); color:var(--md-err); }
.muted { color:var(--md-on-surface-variant); font-size:12.5px; }
.vazio { color:var(--md-on-surface-variant); font-style:italic; font-size:14px; margin:4px 0; }
.toolrow { display:flex; gap:10px; flex-wrap:wrap; margin-left:auto; }
.tbl-wrap { overflow-x:auto; }
:focus-visible { outline:2px solid var(--md-primary); outline-offset:2px; }
</style>
</head>
<body>
<div class="appbar"><div class="in">
  <h1>Controle de Estoque</h1>
  <span class="sub">VBZ · base própria · saída rastreada por técnico terceirizado</span>
</div></div>
<main>
  <section class="card">
    <h2>Nova movimentação</h2>
    <form class="mov" id="fmov">
      <div class="seg wide" id="segtipo">
        <label data-t="entrada" class="on"><input type="radio" name="tipo" value="entrada" checked>⬇ Entrada (compra)</label>
        <label data-t="saida"><input type="radio" name="tipo" value="saida">⬆ Saída (instalação)</label>
        <label data-t="ajuste"><input type="radio" name="tipo" value="ajuste">⚖ Ajuste (contagem)</label>
      </div>
      <label class="fld" style="grid-column:span 2">Item
        <select id="mitem" required></select>
      </label>
      <label class="fld">Qtd <span id="qtdhint" class="muted"></span>
        <input id="mqtd" type="number" min="0" step="1" required>
      </label>
      <label class="fld">Data
        <input id="mdata" type="date" required>
      </label>
      <label class="fld" id="ftec" hidden>Técnico (terceirizado)
        <input id="mtec" list="tecs" placeholder="nome do técnico">
        <datalist id="tecs"></datalist>
      </label>
      <label class="fld wide">Observação (cliente, NF, fornecedor…)
        <input id="mobs" placeholder="opcional">
      </label>
      <div class="wide" style="display:flex;justify-content:flex-end">
        <button class="btn" type="submit">Registrar</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>Saldo atual
      <div class="toolrow">
        <button class="btn txt" id="additem" type="button">+ novo item</button>
        <button class="btn txt" id="exp" type="button">⬇ backup</button>
        <button class="btn txt" id="impbtn" type="button">⬆ restaurar</button>
        <input id="impfile" type="file" accept="application/json" hidden>
      </div>
    </h2>
    <div class="tbl-wrap"><table id="tsaldo">
      <thead><tr><th>Item</th><th class="num">Saldo</th><th class="num">Mínimo</th><th></th></tr></thead>
      <tbody></tbody>
    </table></div>
    <p class="muted" style="margin:10px 0 0">Os dados ficam salvos neste navegador. Usa o <strong>backup</strong> de vez em quando pra guardar um .json fora dele.</p>
  </section>

  <section class="card">
    <h2>Histórico</h2>
    <div id="hist"></div>
  </section>
</main>
<script>
const KEY = 'vbz-estoque-v1';
const SEED_ITEMS = [
  {nome:'Drop óptico 1FO 1km', un:'bobina', min:2},
  {nome:'Conector de campo SC/APC (verde)', un:'un', min:10},
  {nome:'Conector de campo SC/UPC (azul)', un:'un', min:10},
  {nome:'Esticador cunha FE preto', un:'un', min:10},
  {nome:'ONT ZTE 6201b', un:'un', min:3},
  {nome:'ONU Fiberhome bridge', un:'un', min:3},
  {nome:'Roteador TP-Link EX141', un:'un', min:3},
];
let db = {items:[], movs:[]};
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && Array.isArray(s.items)) db = s; } catch(e) {}
if (!db.items.length) db.items = SEED_ITEMS.map((it,i) => ({id:'i'+i, ...it}));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) { alert('Falha ao salvar no navegador!'); } };
const uid = () => 'm' + Date.now() + Math.random().toString(36).slice(2,6);
const byId = id => db.items.find(i => i.id === id);
const saldoDe = id => db.movs.reduce((a,m) => m.item !== id ? a : a + (m.tipo === 'saida' ? -m.qtd : m.tipo === 'entrada' ? m.qtd : m.delta), 0);
const fdata = iso => { const [y,mo,d] = iso.split('-'); return d + '/' + mo + '/' + y.slice(2); };

const $ = s => document.querySelector(s);
const selItem = $('#mitem'), inQtd = $('#mqtd'), inData = $('#mdata'), inTec = $('#mtec'), inObs = $('#mobs');
inData.value = new Date().toISOString().slice(0,10);
let tipo = 'entrada';

function fillItens() {
  selItem.innerHTML = db.items.map(i => `<option value="${i.id}">${i.nome}</option>`).join('');
}
function fillTecs() {
  const tecs = [...new Set(db.movs.map(m => m.tec).filter(Boolean))];
  $('#tecs').innerHTML = tecs.map(t => `<option value="${t}">`).join('');
}
function renderSaldo() {
  $('#tsaldo tbody').innerHTML = db.items.map(i => {
    const s = saldoDe(i.id), baixo = s < i.min;
    return `<tr>
      <td>${i.nome} <span class="muted">(${i.un})</span></td>
      <td class="num ${baixo ? 'saldo-baixo' : 'saldo-ok'}">${s}</td>
      <td class="num muted">${i.min}</td>
      <td>${baixo ? '<span class="chip baixo">repor</span>' : ''}</td>
    </tr>`;
  }).join('');
}
function renderHist() {
  const H = $('#hist');
  if (!db.movs.length) { H.innerHTML = '<p class="vazio">Nenhuma movimentação ainda. Quando o pedido chegar, registra as entradas aqui.</p>'; return; }
  const rows = [...db.movs].sort((a,b) => b.data.localeCompare(a.data) || b.id.localeCompare(a.id));
  H.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>Data</th><th>Tipo</th><th>Item</th><th class="num">Qtd</th><th>Técnico / Obs</th><th></th></tr></thead>
    <tbody>${rows.map(m => {
      const it = byId(m.item);
      const q = m.tipo === 'ajuste' ? (m.delta >= 0 ? '+' + m.delta : m.delta) : (m.tipo === 'saida' ? '−' : '+') + m.qtd;
      const who = [m.tec, m.obs].filter(Boolean).join(' · ');
      return `<tr>
        <td class="num">${fdata(m.data)}</td>
        <td><span class="chip ${m.tipo}">${m.tipo}</span></td>
        <td>${it ? it.nome : '?'}</td>
        <td class="num">${q}</td>
        <td class="muted">${who || '—'}</td>
        <td><button class="del" data-id="${m.id}" title="excluir">✕</button></td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
}
function renderAll() { fillItens(); fillTecs(); renderSaldo(); renderHist(); }

$('#segtipo').addEventListener('change', e => {
  tipo = e.target.value;
  document.querySelectorAll('#segtipo label').forEach(l => l.classList.toggle('on', l.dataset.t === tipo));
  $('#ftec').hidden = tipo !== 'saida';
  $('#qtdhint').textContent = tipo === 'ajuste' ? '(saldo contado)' : '';
});

$('#fmov').addEventListener('submit', e => {
  e.preventDefault();
  const item = selItem.value, qtd = Math.max(0, +inQtd.value || 0);
  if (!item || (!qtd && tipo !== 'ajuste')) return;
  const mov = {id:uid(), data:inData.value, tipo, item, qtd, tec:'', obs:inObs.value.trim()};
  if (tipo === 'saida') {
    mov.tec = inTec.value.trim();
    if (!mov.tec) { inTec.focus(); return alert('Saída precisa do nome do técnico — material com terceirizado tem que ficar rastreado.'); }
    if (qtd > saldoDe(item) && !confirm('Saldo vai ficar negativo. Registrar mesmo assim?')) return;
  }
  if (tipo === 'ajuste') { mov.delta = qtd - saldoDe(item); mov.qtd = qtd; }
  db.movs.push(mov); save(); renderAll();
  inQtd.value = ''; inObs.value = ''; inTec.value = '';
});

$('#hist').addEventListener('click', e => {
  const b = e.target.closest('.del'); if (!b) return;
  if (!confirm('Excluir esta movimentação?')) return;
  db.movs = db.movs.filter(m => m.id !== b.dataset.id); save(); renderAll();
});

$('#additem').addEventListener('click', () => {
  const nome = prompt('Nome do novo item:'); if (!nome || !nome.trim()) return;
  const un = prompt('Unidade (un, bobina, m, cx…):', 'un') || 'un';
  const min = Math.max(0, +prompt('Estoque mínimo (alerta de reposição):', '5') || 0);
  db.items.push({id:'i' + Date.now(), nome:nome.trim(), un:un.trim(), min}); save(); renderAll();
});

$('#exp').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 1)], {type:'application/json'}));
  a.download = 'vbz-estoque-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
});
$('#impbtn').addEventListener('click', () => $('#impfile').click());
$('#impfile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t);
    if (!d || !Array.isArray(d.items) || !Array.isArray(d.movs)) throw new Error('formato');
    if (!confirm('Substituir os dados atuais pelo backup "' + f.name + '"?')) return;
    db = d; save(); renderAll();
  }).catch(() => alert('Arquivo inválido — precisa ser um backup .json exportado daqui.'));
  e.target.value = '';
});

renderAll();
</script>
</body>
</html>
